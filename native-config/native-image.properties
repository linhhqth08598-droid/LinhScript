# Cau hinh native-image cho CEF/AWT
# Add all charsets
Args = -H:+AddAllCharsets
Args = -H:+ReportExceptionStackTraces
Args = --initialize-at-build-time=org.cef
Args = --initialize-at-run-time=org.cef.CefApp
Args = -H:IncludeResources=.*\.dll$
Args = -H:IncludeResources=.*\.so$
Args = -H:IncludeResources=.*\.dylib$
Args = -Djava.awt.headless=false
Args = -Dsun.java2d.d3d=false
Args = -Dsun.java2d.noddraw=true